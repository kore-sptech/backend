services:

  database:
    image: mysql:9
    restart: unless-stopped

    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: test

    ports:
      - "127.0.0.1:3307:3306"

    command:
      - --bind-address=0.0.0.0

    volumes:
      - MYSQL_DATA:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: prod

    image: kore-backend:prod
    pull_policy: build

    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database:3306/test
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ""

      JWT_SECRET: ${JWT_SECRET:-my-secret-key}
      FRONT_END_URL: ${FRONT_END_URL:-http://localhost:5173}

    volumes:
      - uploads:/front-end/public/uploads

    depends_on:
      database:
        condition: service_healthy


volumes:
  MYSQL_DATA:
  uploads: