api.security.token.secret=${JWT_SECRET:my-secret-key}
logging.level.org.springframework.security=DEBUG


front-end.url=${FRONT_END_URL:http://localhost:5173}

aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:}
aws.s3.region=${AWS_S3_REGION:us-east-1}
aws.s3.public-base-url=${AWS_S3_PUBLIC_BASE_URL:}
aws.s3.endpoint-override=${AWS_S3_ENDPOINT_OVERRIDE:}

##a sintaxe ${VAR:default} faz o Spring ler de uma variável de ambiente se ela existir, e usar o valor depois dos dois-pontos como padrão se não existir. Isso é o que permite o docker-compose.yml apontar o backend pro serviço database (em vez de localhost) sem quebrar quem ainda roda o projeto direto na máquina sem Docker — nesse caso continua usando localhost:3306 como sempre foi.



spring.rabbitmq.host=rabbitmq
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest 

spring.rabbitmq.queue.name=notification-queue