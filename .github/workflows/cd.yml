name: CD Back-end

on:
  workflow_run:
    workflows: ["Backend CI/CD"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request') }}
    runs-on: self-hosted
    defaults:
      run:
        working-directory: /home/ubuntu/app
    steps:
      - name: Remover container legado (app-backend) se existir
        run: docker rm -f app-backend || true

      - name: Pull das novas imagens (kore-main e kore-notification)
        run: docker compose pull kore-main kore-notification

      - name: Atualizar containers via Docker Compose
        run: docker compose up -d --force-recreate kore-main kore-notification

      - name: Limpar imagens antigas não utilizadas
        run: docker image prune -f

