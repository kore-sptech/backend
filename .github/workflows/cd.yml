name: CD Back-end

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull Docker image
        run: docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/kore-backend:latest

      - name: Stop Docker container
        run: docker stop app-backend || true

      - name: Remove Docker container
        run: docker rm app-backend || true

      - name: Run Docker container
        run: docker run --name app-backend -d -p 8080:8080 ${{ secrets.DOCKER_HUB_USERNAME }}/kore-backend:latest