name: CD Back-end

on:
  push:
    branches:
      - main

env:
  KORE_IMAGE: henryfranz/kore-back-end-main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull Docker image
        run: docker pull ${{ env.KORE_IMAGE }}:latest

      - name: Stop Docker container
        run: docker stop app-backend || true

      - name: Remove Docker container
        run: docker rm app-backend || true

      - name: Run Docker container
        run: docker run --name app-backend -d -p 8080:8080 ${{ env.KORE_IMAGE }}:latest
