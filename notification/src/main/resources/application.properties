
spring.application.name=notification

spring.jpa.hibernate.ddl-auto=update

spring.datasource.url=jdbc:mysql://database:3306/test?serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=


spring.jpa.show-sql=false

server.port=${PORT:8081}

spring.rabbitmq.host=rabbitmq

spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.rabbitmq.host=${RABBITMQ_HOST:rabbitmq}
spring.rabbitmq.username=${RABBITMQ_DEFAULT_USER:guest}
spring.rabbitmq.password=${RABBITMQ_DEFAULT_PASS:guest}
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false
app.rabbitmq.exchange=kore.notification.events
app.rabbitmq.queue=kore.notification.events.queue
app.rabbitmq.dlx=kore.notification.events.dlx
app.rabbitmq.dlq=kore.notification.events.dlq
app.rabbitmq.routing-key.appointment=notification.appointment.upcoming
app.rabbitmq.routing-key.stock=notification.stock.below-threshold
app.rabbitmq.routing-key.dead-letter=notification.dead

# Fuso horario padrao brasileiro (America/Sao_Paulo)
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.jackson.time-zone=America/Sao_Paulo
