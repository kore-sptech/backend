front-end.url=${FRONT_END_URL:http://localhost:5173}

##a sintaxe ${VAR:default} faz o Spring ler de uma variável de ambiente se ela existir, e usar o valor depois dos dois-pontos como padrão se não existir. Isso é o que permite o docker-compose.yml apontar o backend pro serviço database (em vez de localhost) sem quebrar quem ainda roda o projeto direto na máquina sem Docker — nesse caso continua usando localhost:3306 como sempre foi.